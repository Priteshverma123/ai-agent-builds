[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evaluator-optimizer"
version = "1.0.0"
description = "Evaluator-optimizer: a writer + critic loop with a weighted rubric, scores and stop criteria."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
]

[project.optional-dependencies]
dev = ["pytest>=8"]
anthropic = ["anthropic"]
openai = ["openai"]

[project.scripts]
eval-optimizer = "eval_optimizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
