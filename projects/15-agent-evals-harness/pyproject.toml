[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalkit"
version = "0.1.0"
description = "An agent evals harness: suites, graders, baselines and a CI regression gate (exe_404.ai project 15)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic==2.10.6"]

[project.optional-dependencies]
anthropic = ["anthropic"]
openai = ["openai"]
dev = ["pytest==8.3.4"]

[project.scripts]
evalkit = "evalkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
