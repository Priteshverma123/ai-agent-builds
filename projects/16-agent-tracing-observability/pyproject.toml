[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracekit"
version = "0.1.0"
description = "Span-based tracing for agents: JSONL export, terminal waterfall and HTML viewer (exe_404.ai project 16)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []  # runtime is the standard library only

[project.optional-dependencies]
anthropic = ["anthropic"]
openai = ["openai"]
dev = ["pytest==8.3.4"]

[project.scripts]
tracekit = "tracekit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
