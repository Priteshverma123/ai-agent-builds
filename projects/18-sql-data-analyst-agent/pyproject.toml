[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-data-analyst-agent"
version = "0.1.0"
description = "Natural language -> safe read-only SQL on SQLite, with schema grounding and chart-ready output"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
anthropic = ["anthropic"]
openai = ["openai"]
dev = ["pytest==8.3.4"]

[project.scripts]
sql-analyst = "sql_analyst.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
