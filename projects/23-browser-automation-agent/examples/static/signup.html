<!doctype html>
<html lang="en">
<head><title>Newsletter signup</title></head>
<body>
  <main>
    <h1>Join the newsletter</h1>
    <form action="thanks.html" method="get" aria-label="Signup">
      <input type="email" name="email" aria-label="Your email" placeholder="you@example.com">
      <label><input type="checkbox" name="weekly"> Weekly digest</label>
      <textarea name="note" placeholder="Anything else?"></textarea>
      <button type="submit">Subscribe</button>
      <button type="button" disabled>Subscribe with SSO</button>
    </form>
    <p>Already subscribed? <a href="thanks.html">Skip</a></p>
  </main>
</body>
</html>
