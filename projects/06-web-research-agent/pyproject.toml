[project]
name = "web-research-agent"
version = "1.0.0"
description = "Plan, search, read and write a cited research brief over a local web corpus."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []  # pure standard library

[project.optional-dependencies]
dev = ["pytest==8.3.4"]
anthropic = ["anthropic"]
openai = ["openai"]

[project.scripts]
research-agent = "research_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
