[project]
name = "sre-incident-agent"
version = "1.0.0"
description = "SRE incident agent: anomaly detection, log signatures, evidence-scored hypotheses, runbook tools behind human approval, blameless postmortem"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []  # stdlib only; httpx is needed only with a real LLM provider

[project.optional-dependencies]
llm = ["httpx==0.28.1"]
dev = ["pytest==8.3.4"]

[project.scripts]
sre-agent = "sre_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
